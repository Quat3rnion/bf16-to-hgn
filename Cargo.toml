[package]
name = "bf16-to-hgn"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.85"
build = "build.rs"

[features]
default = []
hip = []
cuda = []

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
half = "2.4"
indicatif = "0.18"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.14"

[build-dependencies]
cc = "1.2"
sha2 = "0.10"

[profile.release]
lto = "thin"
codegen-units = 1
